spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/iloveshop
    username: admin
    password: 1234
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,beans,info
  endpoint:
    health:
      show-details: always