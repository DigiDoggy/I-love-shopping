spring:
  config:
    # local secrets: copy .env.example to .env in the project root (never commit .env)
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GOOGLE_EMAIL}
    password: ${GOOGLE_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iloveshop}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: "http://localhost:8080/login/oauth2/code/{registrationId}"
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user, user:email
            redirect-uri: "http://localhost:8080/login/oauth2/code/{registrationId}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_TOKEN_SECRET}
  access:
    duration: ${JWT_ACCESS_TOKEN_DURATION_SECONDS}
  refresh:
    duration: ${JWT_REFRESH_TOKEN_DURATION_SECONDS}
  reset:
    duration: ${JWT_RESET_PASSWORD_TOKEN_DURATION_SECONDS}

google:
  recaptcha:
    key:
      site: ${FRONTEND_RECAPTCHA_SITE_KEY}
      secret: ${RECAPTCHA_SECRET_KEY}
      threshold: 0.5
