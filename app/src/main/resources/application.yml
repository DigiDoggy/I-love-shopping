spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GOOGLE_EMAIL}
    password: ${GOOGLE_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/iloveshop
    username: admin
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 777319325568-5e5ps42822bqbmqvf4jmaj846pti2fpj.apps.googleusercontent.com
            client-secret: ***REMOVED***
            scope: openid, profile, email
            redirect-uri: "http://localhost:8080/login/oauth2/code/{registrationId}"
          github:
            client-id: Ov23lihVOtbA6rXHMfas
            client-secret: ***REMOVED***
            scope: read:user, user:email
            redirect-uri: "http://localhost:8080/login/oauth2/code/{registrationId}"

management:
  endpoints:
    web:
      exposure:
        include: health,beans,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_TOKEN_SECRET}
  access:
    duration: ${JWT_ACCESS_TOKEN_DURATION_SECONDS}
  refresh:
    duration: ${JWT_REFRESH_TOKEN_DURATION_SECONDS}
  reset:
    duration: ${JWT_RESET_PASSWORD_TOKEN_DURATION_SECONDS}

google:
  recaptcha:
    key:
      site: ${FRONTEND_RECAPTCHA_SITE_KEY}
      secret: ${RECAPTCHA_SECRET_KEY}
      threshold: 0.5
