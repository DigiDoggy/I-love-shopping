spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/iloveshop
    username: admin
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 777319325568-5e5ps42822bqbmqvf4jmaj846pti2fpj.apps.googleusercontent.com
            client-secret: ***REMOVED***
            scope: openid, profile, email
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
#    debug: true
  output:
    ansi:
      enabled: always


management:
  endpoints:
    web:
      exposure:
        include: health,beans,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: WARN
    org.springframework.security.web.FilterChainProxy: ERROR
    org.springframework.security.web.session: ERROR
    org.springframework.security.oauth2: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN

jwt:
  refreshExpirationMs: 604800000



