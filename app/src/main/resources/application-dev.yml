spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/iloveshop
    username: admin
    password: 1234
    profiles:
      active: dev
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
  security:
    oauth2:
      client:
        registration:
