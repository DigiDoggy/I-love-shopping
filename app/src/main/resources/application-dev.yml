    org.springframework.security: WARN
    org.springframework.security.web.FilterChainProxy: ERROR
    org.springframework.security.web.session: ERROR
    org.springframework.security.oauth2: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN

