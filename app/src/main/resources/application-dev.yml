spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iloveshop}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:1234}
    profiles:
      active: dev
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
  output:
    ansi:
      enabled: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: WARN
    org.springframework.security.web.FilterChainProxy: ERROR
    org.springframework.security.web.session: ERROR
    org.springframework.security.oauth2: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN

jwt:
  refreshExpirationMs: 604800000

JWT_ACCESS_TOKEN_DURATION_SECONDS: 900
JWT_REFRESH_TOKEN_DURATION_SECONDS: 604800
JWT_RESET_PASSWORD_TOKEN_DURATION_SECONDS: 900

