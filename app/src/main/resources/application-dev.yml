spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/iloveshop
    username: admin
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,beans,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG

jwt:
  refreshExpirationMs: 604800000



